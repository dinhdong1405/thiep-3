<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#361623" />
      <stop offset="50%" stop-color="#220b16" />
      <stop offset="100%" stop-color="#0e0309" />
    </linearGradient>
    <radialGradient id="p3Glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#ffd580" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#ff7675" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#d63031" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d63031" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#fd79a8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fd79a8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="p3Port" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#341421" />
      <stop offset="100%" stop-color="#0f0309" />
    </linearGradient>
  </defs>

  <rect width="400" height="480" fill="url(#p3Bg)" />
  <circle cx="200" cy="190" r="150" fill="url(#p3Glow)" />

  <!-- Twinkling Cafe / Restaurant Lights -->
  <circle cx="60" cy="70" r="40" fill="url(#bokeh3)" />
  <circle cx="340" cy="110" r="45" fill="url(#bokeh3)" />
  <circle cx="120" cy="150" r="25" fill="url(#bokeh3)" />
  <circle cx="300" cy="210" r="35" fill="url(#bokeh3)" />

  <!-- Hanging Twinkle Lights Strings -->
  <line x1="80" y1="0" x2="80" y2="110" stroke="#ffeaa7" stroke-width="0.8" opacity="0.45" />
  <circle cx="80" cy="110" r="4" fill="#ffd32a" />
  <line x1="160" y1="0" x2="160" y2="60" stroke="#ffeaa7" stroke-width="0.8" opacity="0.45" />
  <circle cx="160" cy="60" r="3.5" fill="#ffeaa7" />
  <line x1="240" y1="0" x2="240" y2="80" stroke="#ffeaa7" stroke-width="0.8" opacity="0.45" />
  <circle cx="240" cy="80" r="3" fill="#ffd32a" />
  <line x1="320" y1="0" x2="320" y2="130" stroke="#ffeaa7" stroke-width="0.8" opacity="0.45" />
  <circle cx="320" cy="130" r="4.5" fill="#ffeaa7" />

  <!-- Sweet Portrait Silhouette with Gentle Smile -->
  <path d="M 120 350 C 130 295, 160 268, 200 268 C 240 268, 270 295, 280 350 Z" fill="url(#p3Port)" />
  <rect x="189" y="228" width="22" height="42" rx="10" fill="#280f1b" />
  <ellipse cx="200" cy="190" rx="32" ry="38" fill="#280f1b" />

  <!-- Hair Waves -->
  <path d="M 163 162 C 158 125, 242 125, 237 162 C 251 180, 254 218, 243 250 C 232 236, 232 208, 232 190 C 227 167, 205 162, 195 162 C 177 162, 170 180, 168 198 C 168 222, 154 240, 146 254 C 144 218, 149 180, 163 162 Z" fill="#13050d" />

  <!-- Soft Cheeks & Smile -->
  <ellipse cx="189" cy="198" rx="4" ry="2" fill="#ff7675" opacity="0.6" />
  <ellipse cx="211" cy="198" rx="4" ry="2" fill="#ff7675" opacity="0.6" />
  <path d="M 194 210 Q 200 215, 206 210" stroke="#ff9d5c" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 184 188 Q 189 184, 194 188" stroke="#ff9d5c" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 206 188 Q 211 184, 216 188" stroke="#ff9d5c" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Rim Light -->
  <path d="M 165 158 C 177 138, 223 138, 235 158" stroke="#ffeaa7" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 152 218 C 149 236, 154 250, 159 259" stroke="#ffd580" stroke-width="2" fill="none" opacity="0.65" />
  <path d="M 248 218 C 251 236, 246 250, 241 259" stroke="#ffd580" stroke-width="2" fill="none" opacity="0.65" />
</svg>