<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1434" />
      <stop offset="50%" stop-color="#1d0a22" />
      <stop offset="100%" stop-color="#0e0411" />
    </linearGradient>
    <radialGradient id="p2Lamp" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#fdcb6e" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#e84393" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#e84393" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="p2Amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f39c12" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#e67e22" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="p2Rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fd79a8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="p2Sil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#341830" />
      <stop offset="100%" stop-color="#100510" />
    </linearGradient>
  </defs>

  <rect width="400" height="480" fill="url(#p2Bg)" />
  <circle cx="200" cy="110" r="160" fill="url(#p2Lamp)" />

  <!-- Bokeh Balls -->
  <circle cx="70" cy="100" r="40" fill="url(#p2Rose)" />
  <circle cx="330" cy="70" r="50" fill="url(#p2Amber)" />
  <circle cx="290" cy="170" r="34" fill="url(#p2Rose)" />
  <circle cx="100" cy="200" r="30" fill="url(#p2Amber)" />
  <circle cx="360" cy="260" r="44" fill="url(#p2Amber)" />

  <!-- Fairy Lights Garland -->
  <path d="M 0 50 Q 100 85, 200 55 T 400 50" fill="none" stroke="#ffeaa7" stroke-width="1.2" opacity="0.45" />
  <circle cx="50" cy="64" r="3" fill="#ffeaa7" />
  <circle cx="100" cy="74" r="3.5" fill="#ffd32a" />
  <circle cx="150" cy="70" r="3" fill="#ffeaa7" />
  <circle cx="200" cy="55" r="4" fill="#fff" />
  <circle cx="250" cy="62" r="3" fill="#ffd32a" />
  <circle cx="300" cy="68" r="3.5" fill="#ffeaa7" />
  <circle cx="350" cy="60" r="3" fill="#ffd32a" />

  <!-- Couple Silhouette Enjoying Drinks Together -->
  <!-- Him (Left) -->
  <path d="M 70 340 C 90 270, 110 220, 140 210 C 160 205, 175 218, 175 240 C 175 270, 140 300, 145 340 Z" fill="url(#p2Sil)" />
  <circle cx="145" cy="185" rx="20" ry="24" fill="#1b081c" />
  <path d="M 127 172 C 132 158, 158 155, 168 167 C 172 180, 168 194, 159 200 Z" fill="#120412" />

  <!-- Her (Right) -->
  <path d="M 330 340 C 310 270, 290 220, 260 210 C 240 205, 225 218, 225 240 C 225 270, 260 300, 255 340 Z" fill="url(#p2Sil)" />
  <circle cx="255" cy="185" rx="20" ry="24" fill="#1b081c" />
  <path d="M 273 172 C 263 154, 236 158, 232 176 C 223 203, 236 238, 246 264 C 255 242, 268 224, 277 198 Z" fill="#120412" />

  <!-- Rim Light -->
  <path d="M 158 172 C 164 185, 162 198, 154 205" stroke="#fdcb6e" stroke-width="2" fill="none" opacity="0.85" />
  <path d="M 242 172 C 236 185, 238 198, 246 205" stroke="#fdcb6e" stroke-width="2" fill="none" opacity="0.85" />

  <!-- Table Silhouette & Warm Mugs / Wine -->
  <rect x="0" y="325" width="400" height="155" fill="#0b020c" />
  <line x1="0" y1="325" x2="400" y2="325" stroke="#fd79a8" stroke-width="1.5" opacity="0.35" />

  <!-- Rose on Table -->
  <path d="M 170 325 Q 200 316, 230 325" stroke="#27ae60" stroke-width="3" fill="none" />
  <circle cx="200" cy="318" r="8" fill="#e84393" />
  <circle cx="198" cy="316" r="5" fill="#ff7675" />

  <!-- Mugs -->
  <rect x="175" y="302" width="16" height="21" rx="4" fill="#ffffff" fill-opacity="0.16" stroke="#ffeaa7" stroke-width="1.2" />
  <rect x="210" y="302" width="16" height="21" rx="4" fill="#ffffff" fill-opacity="0.16" stroke="#ffeaa7" stroke-width="1.2" />
</svg>