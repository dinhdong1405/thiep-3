<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1226" />
      <stop offset="50%" stop-color="#240b17" />
      <stop offset="100%" stop-color="#12040b" />
    </linearGradient>
    <radialGradient id="p1Glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffd580" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ff9a6c" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#d6336c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#d6336c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fab1a0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7675" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e84393" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="p1Sil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0d1b" />
      <stop offset="100%" stop-color="#0e0309" />
    </linearGradient>
    <linearGradient id="p1Rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeedb" />
      <stop offset="60%" stop-color="#ffaa7f" />
      <stop offset="100%" stop-color="#e84393" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#p1Bg)" />

  <!-- Ambient Bokeh Circles -->
  <circle cx="80" cy="80" r="48" fill="url(#bokeh1)" />
  <circle cx="320" cy="100" r="58" fill="url(#bokeh2)" />
  <circle cx="200" cy="60" r="38" fill="url(#bokeh1)" />
  <circle cx="50" cy="220" r="32" fill="url(#bokeh2)" />
  <circle cx="350" cy="230" r="42" fill="url(#bokeh1)" />
  <circle cx="200" cy="220" r="130" fill="url(#p1Glow)" />

  <!-- Twinkling Ambient Sparkles -->
  <circle cx="110" cy="50" r="2.5" fill="#fff" opacity="0.85" />
  <circle cx="290" cy="70" r="2" fill="#fff" opacity="0.75" />
  <circle cx="340" cy="150" r="2.5" fill="#ffd580" opacity="0.9" />
  <circle cx="70" cy="140" r="2" fill="#ffb8b8" opacity="0.8" />

  <!-- Romantic Couple Portrait Silhouette -->
  <!-- Him (Left) -->
  <path d="M 105 215 C 105 185, 125 160, 150 160 C 168 160, 182 175, 182 200 C 182 220, 168 233, 158 240 C 158 250, 175 265, 190 285 C 155 290, 110 305, 80 345 C 75 315, 70 265, 90 235 Z" fill="url(#p1Sil)" />
  <!-- Her (Right) -->
  <path d="M 295 215 C 295 185, 275 160, 250 160 C 232 160, 218 175, 218 200 C 218 220, 232 233, 242 240 C 242 250, 225 265, 210 285 C 245 290, 290 305, 320 345 C 325 315, 330 265, 310 235 Z" fill="url(#p1Sil)" />

  <!-- Faces / Profiles -->
  <ellipse cx="150" cy="200" rx="24" ry="28" fill="#1b0811" />
  <path d="M 132 185 C 137 167, 160 165, 174 176 C 178 190, 174 204, 169 212 C 161 223, 146 228, 137 218 Z" fill="#14050d" />
  <ellipse cx="250" cy="202" rx="22" ry="27" fill="#1b0811" />
  <path d="M 232 176 C 246 162, 274 167, 277 186 C 283 214, 274 242, 267 261 C 260 242, 246 233, 236 218 Z" fill="#14050d" />

  <!-- Rim light highlights -->
  <path d="M 168 180 C 172 190, 170 203, 165 211" stroke="url(#p1Rim)" stroke-width="2.5" fill="none" opacity="0.85" />
  <path d="M 232 180 C 228 190, 230 203, 235 211" stroke="url(#p1Rim)" stroke-width="2.5" fill="none" opacity="0.85" />

  <!-- Candlelight Table Surface & Champagne Glasses -->
  <path d="M 0 340 L 400 340 L 400 480 L 0 480 Z" fill="#0c0307" />
  <line x1="0" y1="340" x2="400" y2="340" stroke="#ff9a6c" stroke-width="1.5" opacity="0.4" />

  <!-- Glasses -->
  <path d="M 160 335 L 160 315 Q 155 305, 150 292 Q 160 288, 170 292 Q 165 305, 160 315" fill="none" stroke="#ffeaa7" stroke-width="1.5" opacity="0.75" />
  <path d="M 152 297 Q 160 294, 168 297 L 165 309 Q 160 313, 155 309 Z" fill="#e84393" opacity="0.55" />
  <line x1="150" y1="335" x2="170" y2="335" stroke="#ffeaa7" stroke-width="1.5" opacity="0.75" />

  <path d="M 240 335 L 240 315 Q 235 305, 230 292 Q 240 288, 250 292 Q 245 305, 240 335" fill="none" stroke="#ffeaa7" stroke-width="1.5" opacity="0.75" />
  <path d="M 232 297 Q 240 294, 248 297 L 245 309 Q 240 313, 235 309 Z" fill="#e84393" opacity="0.55" />
  <line x1="230" y1="335" x2="250" y2="335" stroke="#ffeaa7" stroke-width="1.5" opacity="0.75" />

  <!-- Candle in glass -->
  <rect x="191" y="318" width="18" height="22" rx="3" fill="#ffffff" fill-opacity="0.12" stroke="#ffeaa7" stroke-width="1.5" opacity="0.8" />
  <rect x="195" y="325" width="10" height="13" rx="2" fill="#fffdfa" opacity="0.9" />
  <path d="M 200 324 C 197 318, 197 311, 200 306 C 203 311, 203 318, 200 324 Z" fill="#ffd32a" />
</svg>